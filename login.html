<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MilkTankAgent — Вход</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<style>
    body {
        background: #f4f4f4;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
    }
</style>
</head>
<body>
<div class="card shadow-sm" style="width: 300px;">
    <div class="card-body">
        <h1 class="h5 mb-3">MilkTankAgent</h1>
        <input type="password" class="form-control mb-2" id="password" placeholder="Пароль" autofocus>
        <button class="btn btn-primary w-100" onclick="login()">Войти</button>
        <div class="text-danger small mt-2" id="error"></div>
    </div>
</div>

<script>
async function login() {
    const password = document.getElementById('password').value;
    const errorBox = document.getElementById('error');

    errorBox.textContent = '';

    try {
        const response = await fetch('/api/login', {
            method: 'POST',
            body: JSON.stringify({ password })
        });

        const data = await response.json();

        if (!data.ok) {
            errorBox.textContent = 'Неверный пароль';
            return;
        }

        sessionStorage.setItem('token', data.token);
        window.location.href = 'index.html';

    } catch (e) {
        errorBox.textContent = 'Ошибка соединения с сервером';
    }
}

document.getElementById('password').addEventListener('keydown', (e) => {
    if (e.key === 'Enter') login();
});
</script>
</body>
</html>
