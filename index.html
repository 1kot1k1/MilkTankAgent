<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>MilkTankAgent</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background: #f4f4f4;
            padding-bottom: 40px;
        }

        .device-card.offline {
            opacity: 0.5;
        }

        .device-weight {
            font-size: 1.6rem;
            font-weight: 700;
        }

        .empty {
            color: #888;
            text-align: center;
            margin-top: 40px;
        }
    </style>
</head>
<body>
    <div class="container py-4">
        <div class="d-flex justify-content-between align-items-center flex-wrap mb-2">
            <h1 class="h4 mb-2">MilkTankAgent</h1>
            <nav class="mb-2">
                <a href="devices.html" class="btn btn-sm btn-outline-primary me-1">Устройства</a>
                <a href="settings.html" class="btn btn-sm btn-outline-primary me-1">Настройки</a>
                <a href="logs.html" class="btn btn-sm btn-outline-primary">Журнал</a>
            </nav>
        </div>
        <div id="status" class="small text-muted mb-3">Подключение...</div>
        <div id="devices"></div>
    </div>

    <script>
        const token = sessionStorage.getItem('token');

        if (!token) {
            window.location.href = 'login.html';
        }

        const devicesById = {};

        function formatWeight(grams) {
            const value = grams ?? 0;

            if (value >= 1000) {
                return (value / 1000).toFixed(1) + ' кг';
            }

            return value.toFixed(0) + ' г';
        }

        function statusLine(d) {
            if (d.event === 'disabled' || d.enabled === false) {
                return 'выключено';
            }

            if (d.event === 'offline' || d.online === false) {
                return 'нет связи';
            }

            return d.stable ? 'стабильно' : 'нестабильно';
        }

        function renderDevices() {
            const container = document.getElementById('devices');
            const list = Object.values(devicesById);

            if (list.length === 0) {
                container.innerHTML = '<div class="empty">Пока нет данных с устройств</div>';
                return;
            }

            container.innerHTML = list.map(d => `
            <div class="card device-card mb-2 ${d.online === false ? 'offline' : ''}">
                <div class="card-body d-flex justify-content-between align-items-center">
                    <div>
                        <div class="fw-bold">${d.name || d.uuid}</div>
                        <div class="small text-muted">
                            ${statusLine(d)}
                            ${d.overload ? '<span class="text-danger fw-bold ms-1">ПЕРЕГРУЗ</span>' : ''}
                        </div>
                    </div>
                    <div class="device-weight">${formatWeight(d.weight)}</div>
                </div>
            </div>
        `).join('');
        }

        async function loadInitialState() {
            try {
                const response = await fetch('/api/devices?token=' + encodeURIComponent(token));

                if (response.status === 401) {
                    sessionStorage.removeItem('token');
                    window.location.href = 'login.html';
                    return;
                }

                const devices = await response.json();

                for (const d of devices) {
                    devicesById[d.uuid] = d;
                }

                renderDevices();

            } catch (e) {
                document.getElementById('status').textContent = 'Ошибка загрузки данных';
            }
        }

        function connectWebSocket() {
            const statusEl = document.getElementById('status');

            const wsUrl = 'ws://' + window.location.hostname + ':8081/?token=' + encodeURIComponent(token);
            const ws = new WebSocket(wsUrl);

            ws.onopen = () => {
                statusEl.textContent = 'Подключено';
                statusEl.className = 'small text-success mb-3';
            };

            ws.onmessage = (event) => {
                try {
                    const data = JSON.parse(event.data);
                    if (data.uuid) {
                        devicesById[data.uuid] = { ...devicesById[data.uuid], ...data };
                        renderDevices();
                    }
                } catch (e) {
                    console.error('Failed to parse WS message:', e, event.data);
                }
            };

            ws.onclose = () => {
                statusEl.textContent = 'Соединение потеряно, переподключение...';
                statusEl.className = 'small text-danger mb-3';
                setTimeout(connectWebSocket, 3000);
            };

            ws.onerror = () => {
                ws.close();
            };
        }

        loadInitialState();
        connectWebSocket();
    </script>
</body>
</html>
