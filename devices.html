<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>MilkTankAgent — Устройства</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background: #f4f4f4;
            padding-bottom: 40px;
        }
    </style>
</head>
<body>
    <div class="container py-4" style="max-width: 640px;">
        <a href="index.html" class="btn btn-link ps-0">&larr; К данным</a>
        <h1 class="h4 mb-3">Устройства</h1>

        <div class="card mb-3">
            <div class="card-body">
                <h2 class="h6" id="formTitle">Добавить устройство</h2>

                <input type="hidden" id="editUuid" value="">

                <label class="form-label small mt-2">Название</label>
                <input type="text" class="form-control" id="name" placeholder="Танк 1">

                <label class="form-label small mt-2">Порт</label>
                <input type="text" class="form-control" id="port" placeholder="/dev/ttyUSB0" value="/dev/ttyUSB0">

                <label class="form-label small mt-2">Скорость (baud rate)</label>
                <select class="form-select" id="baudRate">
                    <option>9600</option>
                    <option>19200</option>
                    <option>38400</option>
                    <option>57600</option>
                    <option selected>115200</option>
                </select>

                <label class="form-label small mt-2">Modbus-адрес</label>
                <input type="number" class="form-control" id="address" value="1" min="1" max="159">

                <button class="btn btn-primary mt-3" id="saveButton" onclick="saveDevice()">Добавить</button>
                <button class="btn btn-outline-secondary mt-3 ms-1 d-none" id="cancelEditButton" onclick="cancelEdit()">Отмена</button>
                <div class="text-danger small mt-2" id="addError"></div>
            </div>
        </div>

        <div class="card">
            <div class="card-body">
                <h2 class="h6">Список устройств</h2>
                <div id="deviceList" class="text-muted">Загрузка...</div>
            </div>
        </div>
    </div>

    <script>
        const token = sessionStorage.getItem('token');

        if (!token) {
            window.location.href = 'login.html';
        }

        async function loadDevices() {
            const container = document.getElementById('deviceList');

            try {
                const response = await fetch('/api/devices?token=' + encodeURIComponent(token));

                if (response.status === 401) {
                    sessionStorage.removeItem('token');
                    window.location.href = 'login.html';
                    return;
                }

                const devices = await response.json();

                if (devices.length === 0) {
                    container.innerHTML = '<div class="text-muted">Пока нет добавленных устройств</div>';
                    return;
                }

                container.innerHTML = devices.map(d => `
                <div class="d-flex justify-content-between align-items-center py-2 border-bottom">
                    <div>
                        <div>${d.name}</div>
                        <div class="small text-muted">${d.port} · ${d.baudRate} · адрес ${d.address}</div>
                    </div>
                    <div>
                        <button class="btn btn-sm btn-outline-primary" onclick='editDevice(${JSON.stringify(d)})'>Изменить</button>
                        <button class="btn btn-sm btn-outline-secondary ms-1" onclick="toggleDevice('${d.uuid}', ${!d.enabled})">
                            ${d.enabled ? 'Выключить' : 'Включить'}
                        </button>
                        <button class="btn btn-sm btn-outline-danger ms-1" onclick="removeDevice('${d.uuid}')">Удалить</button>
                    </div>
                </div>
            `).join('');

            } catch (e) {
                container.innerHTML = '<div class="text-danger">Ошибка загрузки списка</div>';
            }
        }

        function editDevice(device) {
            document.getElementById('editUuid').value = device.uuid;
            document.getElementById('name').value = device.name;
            document.getElementById('port').value = device.port;
            document.getElementById('baudRate').value = String(device.baudRate);
            document.getElementById('address').value = device.address;

            document.getElementById('formTitle').textContent = 'Изменить устройство';
            document.getElementById('saveButton').textContent = 'Сохранить изменения';
            document.getElementById('cancelEditButton').classList.remove('d-none');

            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function cancelEdit() {
            document.getElementById('editUuid').value = '';
            document.getElementById('name').value = '';
            document.getElementById('port').value = '/dev/ttyUSB0';
            document.getElementById('baudRate').value = '115200';
            document.getElementById('address').value = '1';

            document.getElementById('formTitle').textContent = 'Добавить устройство';
            document.getElementById('saveButton').textContent = 'Добавить';
            document.getElementById('cancelEditButton').classList.add('d-none');
            document.getElementById('addError').textContent = '';
        }

        async function saveDevice() {
            const errorBox = document.getElementById('addError');
            errorBox.textContent = '';

            const uuid = document.getElementById('editUuid').value;
            const name = document.getElementById('name').value.trim();
            const port = document.getElementById('port').value.trim();
            const baudRate = parseInt(document.getElementById('baudRate').value, 10);
            const address = parseInt(document.getElementById('address').value, 10);

            if (!name || !port) {
                errorBox.textContent = 'Укажите название и порт';
                return;
            }

            try {
                const response = uuid
                    ? await fetch('/api/devices/' + encodeURIComponent(uuid), {
                        method: 'PUT',
                        body: JSON.stringify({ token, name, port, baudRate, address })
                    })
                    : await fetch('/api/devices', {
                        method: 'POST',
                        body: JSON.stringify({ token, name, port, baudRate, address, enabled: true })
                    });

                const data = await response.json();

                if (!response.ok) {
                    errorBox.textContent = data.error || 'Не удалось сохранить устройство';
                    return;
                }

                cancelEdit();
                loadDevices();

            } catch (e) {
                errorBox.textContent = 'Ошибка соединения с сервером';
            }
        }

        async function removeDevice(uuid) {
            if (!confirm('Удалить устройство?')) return;

            await fetch('/api/devices/' + encodeURIComponent(uuid) + '?token=' + encodeURIComponent(token), {
                method: 'DELETE'
            });

            loadDevices();
        }

        async function toggleDevice(uuid, enabled) {
            await fetch('/api/devices/' + encodeURIComponent(uuid) + '/enabled', {
                method: 'POST',
                body: JSON.stringify({ token, enabled })
            });

            loadDevices();
        }

        loadDevices();
    </script>
</body>
</html>
